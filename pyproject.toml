[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janus-synapse-edge"
version = "1.0.0"
description = "Dual-engine autonomous AI cluster running on constraint-optimized hardware."
readme = "README.md"
requires-python = ">=3.13"

# CRITICAL: Production AI is Rust-Native.
# Python is strictly reserved for OKF Validation, Docs, and GitOps scripting.
dependencies = [
    "pyyaml>=6.0.2",
    "pydantic>=2.10.0", # Highly recommended for OKF schema validation
]

[tool.uv]
package = false # Disables Python package building for this documentation repo
managed = true

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "zensical>=0.0.45",
    "types-PyYAML>=6.0.12",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
