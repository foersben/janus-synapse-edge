repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(\.agents/|docs/)
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^cluster-tools/|^infrastructure/
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-json
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [--fix, --disable, MD013]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
        args: ["--ignore-words-list", "letta,nvfp4,gguf,ihs,sme"]

  # --- LOCAL HOOKS (Utilizing your `uv` environment) ---
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff Format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: check-identity
        name: Enforce Author Identity & GPG
        entry: |
          bash -c '
          REQUIRED_MAIL="mail@benjamin-foerster.de";
          ACTUAL_MAIL=$(git config user.email);
          SIGNING_ENABLED=$(git config commit.gpgsign);

          if [ "$ACTUAL_MAIL" != "$REQUIRED_MAIL" ]; then
            echo "❌ ERROR: Wrong Git Email!";
            echo "Expected: $REQUIRED_MAIL";
            echo "Found:    $ACTUAL_MAIL";
            exit 1;
          fi;

          if [ "$SIGNING_ENABLED" != "true" ]; then
            echo "❌ ERROR: GPG signing is disabled in git config.";
            echo "Run: git config commit.gpgsign true";
            exit 1;
          fi'
        language: system
        pass_filenames: false
        always_run: true

      - id: validate-okf
        name: Enforce Google Open Knowledge Format
        entry: uv run python scripts/validate_okf.py ./docs
        language: system
        files: ^(docs/|\.agents/).*\.md$
        pass_filenames: false
